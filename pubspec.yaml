name: sumati
description: A scam simulation practice app for the elderly.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  go_router: ^14.2.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  flutter_secure_storage: ^9.2.0
  dio: ^5.4.0
  web_socket_channel: ^3.0.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  google_mlkit_text_recognition: ^0.13.0
  google_fonts: ^6.2.0
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  firebase_messaging: any # Changed to any to let the solver resolve the web package conflict
  image_picker: ^1.1.2
  audioplayers: ^6.8.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  alchemist: ^0.14.1
  build_runner: ^2.4.0
  riverpod_generator: any
  hive_ce_generator: any
  hive_generator: any
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/scenarios/
    - assets/scenarios/en/
    - assets/scenarios/hi/
    - assets/scenarios/mr/
